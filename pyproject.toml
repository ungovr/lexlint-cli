# A placeholder: it holds the name `lexlint` on PyPI and proves the release path, a yank and a
# republish before the first real release, 0.1.0.
[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lexlint"
version = "0.0.2"
description = "A placeholder for the LexLint command line, which is not released yet."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://lexlint.io"

[project.scripts]
lexlint = "lexlint:main"

[tool.setuptools]
packages = ["lexlint"]
